<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('주문내역')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h1>주문내역</h1>
    <p th:if="${orders.isEmpty()}" class="empty">주문 내역이 없습니다.</p>
    <table class="table" th:if="${!orders.isEmpty()}">
        <thead><tr><th>주문번호</th><th>상품</th><th>금액</th><th>상태</th></tr></thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td><a th:href="@{/orders/{no}(no=${o.orderNo})}" th:text="${o.orderNo}"></a></td>
            <td th:text="${o.summary}"></td>
            <td th:text="|${#numbers.formatInteger(o.total, 0, 'COMMA')}원|"></td>
            <td><span class="pill" th:classappend="${o.status.css}" th:text="${o.status.label}"></span></td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
