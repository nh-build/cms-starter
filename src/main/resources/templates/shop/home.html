<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('홈')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <th:block th:each="s : ${sections}" th:switch="${s.type.name()}">
        <th:block th:case="'HERO'"><th:block th:replace="~{fragments/sections :: hero}"></th:block></th:block>
        <th:block th:case="'FEATURED'"><th:block th:replace="~{fragments/sections :: productGrid(${s.title}, ${featured}, '/products')}"></th:block></th:block>
        <th:block th:case="'NEW'"><th:block th:replace="~{fragments/sections :: productGrid(${s.title}, ${newest}, '/products?sort=new')}"></th:block></th:block>
        <th:block th:case="'BEST'"><th:block th:replace="~{fragments/sections :: productGrid(${s.title}, ${best}, '/products?sort=best')}"></th:block></th:block>
        <th:block th:case="'CATEGORY'"><th:block th:replace="~{fragments/sections :: categories(${s.title})}"></th:block></th:block>
        <th:block th:case="'EVENT'"><th:block th:replace="~{fragments/sections :: event(${s.title})}"></th:block></th:block>
    </th:block>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/shop.js}"></script>
</body>
</html>
