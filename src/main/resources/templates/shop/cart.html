<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('장바구니')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h1>장바구니</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <p th:if="${items.isEmpty()}" class="empty">장바구니가 비어 있습니다. <a th:href="@{/products}">쇼핑 계속하기</a></p>
    <div class="checkout-layout" th:if="${!items.isEmpty()}">
        <div class="lines">
            <div class="line" th:each="i : ${items}">
                <div class="mini-thumb">
                    <img th:if="${i.product.thumbnail != null}" th:src="@{${i.product.thumbnail}}" alt="">
                </div>
                <div class="line-info">
                    <a th:href="@{/products/{id}(id=${i.product.id})}" class="line-name" th:text="${i.product.name}">상품</a>
                    <div class="muted" th:text="${(i.color ?: '') + (i.color != null and i.size != null ? ' / ' : '') + (i.size ?: '')}"></div>
                    <form th:action="@{/cart/{id}/quantity(id=${i.id})}" method="post" class="qty-form">
                        <input type="number" name="quantity" th:value="${i.quantity}" min="0" max="99" class="qty">
                        <button class="btn small outline" type="submit">변경</button>
                    </form>
                </div>
                <div class="line-price">
                    <strong th:text="|${#numbers.formatInteger(i.lineTotal, 0, 'COMMA')}원|">0원</strong>
                    <form th:action="@{/cart/{id}/delete(id=${i.id})}" method="post"><button class="link-btn" type="submit">삭제</button></form>
                </div>
            </div>
        </div>
        <aside class="summary">
            <h3>결제 금액</h3>
            <dl>
                <dt>상품금액</dt><dd th:text="|${#numbers.formatInteger(itemsTotal, 0, 'COMMA')}원|"></dd>
                <dt>배송비</dt><dd th:text="|${#numbers.formatInteger(shippingFee, 0, 'COMMA')}원|"></dd>
            </dl>
            <div class="total"><span>총 결제금액</span><strong th:text="|${#numbers.formatInteger(total, 0, 'COMMA')}원|"></strong></div>
            <a class="btn primary block" th:href="@{/checkout}">주문하기</a>
        </aside>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
