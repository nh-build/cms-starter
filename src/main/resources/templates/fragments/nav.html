<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- 데스크톱 인라인 네비: 메뉴 데이터는 GlobalModelAdvice 의 navMenu (관리자 > 메뉴 관리) -->
<nav th:fragment="inlineNav" class="main-nav" aria-label="주요 메뉴">
    <a th:each="l : ${navMenu}" th:href="@{${l.href}}" th:text="${l.label}">전체상품</a>
</nav>

<!-- MENU 버튼으로 여는 드로어: 오버레이 헤더와 모바일에서 사용 -->
<div th:fragment="drawer" class="drawer" id="navDrawer" aria-hidden="true">
    <div class="drawer-backdrop" data-menu-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-label="메뉴">
        <button type="button" class="drawer-close" data-menu-close aria-label="메뉴 닫기">×</button>
        <nav class="drawer-nav" aria-label="주요 메뉴">
            <a th:each="l : ${navMenu}" th:href="@{${l.href}}" th:text="${l.label}">전체상품</a>
        </nav>
        <form th:action="@{/products}" method="get" class="drawer-search">
            <input type="search" name="q" placeholder="상품 검색" aria-label="상품 검색">
        </form>
        <div class="drawer-account">
            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" th:text="#{header.login}">로그인</a>
                <a th:href="@{/register}" th:text="#{header.register}">회원가입</a>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <a th:href="@{/orders}" th:text="#{header.orders}">주문내역</a>
            </th:block>
            <a th:href="@{/cart}" th:text="#{header.bag}">장바구니</a>
        </div>
    </aside>
</div>
</body>
</html>
