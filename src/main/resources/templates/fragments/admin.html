<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <title th:text="${title} + ' | ' + ${brand.name} + ' Admin'">Admin</title>
    <link rel="stylesheet" th:if="${!#strings.isEmpty(brand.fontCssUrl)}" th:href="${brand.fontCssUrl}">
    <link rel="stylesheet" th:href="@{/css/brand.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style th:utext="${brand.cssVars}"></style>
</head>
<body>

<aside th:fragment="sidebar(active)" class="sidebar">
    <a class="brand" th:href="@{/admin}"><span th:text="${brand.name}">LUMO</span> Admin</a>
    <nav>
        <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'on'">대시보드</a>
        <a th:href="@{/admin/products}" th:classappend="${active == 'products'} ? 'on'">상품 관리</a>
        <a th:href="@{/admin/orders}" th:classappend="${active == 'orders'} ? 'on'">주문 관리</a>
        <a th:href="@{/admin/categories}" th:classappend="${active == 'categories'} ? 'on'">카테고리</a>
        <a th:href="@{/admin/banners}" th:classappend="${active == 'banners'} ? 'on'">배너 관리</a>
        <a th:href="@{/admin/members}" th:classappend="${active == 'members'} ? 'on'">회원 관리</a>
        <span class="nav-group">디자인</span>
        <a th:href="@{/admin/menus}" th:classappend="${active == 'menus'} ? 'on'">메뉴 관리</a>
        <a th:href="@{/admin/sections}" th:classappend="${active == 'sections'} ? 'on'">메인 레이아웃</a>
        <a th:href="@{/admin/design}" th:classappend="${active == 'design'} ? 'on'">디자인 설정</a>
    </nav>
    <div class="side-foot">
        <a th:href="@{/}" target="_blank">스토어 보기 ↗</a>
        <form th:action="@{/admin/logout}" method="post"><button type="submit">로그아웃</button></form>
    </div>
</aside>

<div th:fragment="flash">
    <div class="alert ok" th:if="${message}" th:text="${message}"></div>
    <div class="alert err" th:if="${error}" th:text="${error}"></div>
</div>

<nav th:fragment="pagination(page, baseUrl)" class="pagination" th:if="${page.totalPages > 1}">
    <a th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
       th:href="${baseUrl + (#strings.contains(baseUrl, '?') ? '&' : '?') + 'page=' + i}"
       th:classappend="${i == page.number} ? 'active'" th:text="${i + 1}">1</a>
</nav>
</body>
</html>
