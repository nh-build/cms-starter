<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <title th:text="${title} + ' | ' + ${brand.name}">Shop</title>
    <link rel="stylesheet" th:if="${!#strings.isEmpty(brand.fontCssUrl)}" th:href="${brand.fontCssUrl}">
    <link rel="stylesheet" th:href="@{/css/brand.css}">
    <link rel="stylesheet" th:href="@{/css/shop.css}">
    <style th:utext="${brand.cssVars}"></style>
</head>
<body>

<!-- 상단 헤더. heroOverlay=true 이면 메인 히어로 이미지 위에 투명하게 겹친다 (라벨은 messages.properties) -->
<header th:fragment="header" class="site-header" th:with="o=${heroOverlay == true}"
        th:classappend="${o} ? ('overlay tone-' + ${heroNavTone})" data-site-header>
    <div class="container header-inner">
        <button type="button" class="menu-btn" data-menu-open aria-controls="navDrawer" aria-expanded="false"
                th:text="#{header.overlay.menu}">MENU</button>
        <a class="logo" th:href="@{/}">
            <img th:if="${brand.hasLogo()}" th:src="@{${brand.logoPath}}" th:alt="${brand.name}">
            <span th:unless="${brand.hasLogo()}" th:text="${brand.name}">LUMO</span>
        </a>
        <nav th:replace="~{fragments/nav :: inlineNav}"></nav>
        <div class="header-actions">
            <button type="button" class="link-btn search-toggle" data-search-toggle aria-label="검색"
                    th:text="#{header.overlay.search}">Search</button>
            <form th:action="@{/products}" method="get" class="search">
                <input type="search" name="q" placeholder="검색" aria-label="상품 검색">
            </form>
            <th:block sec:authorize="!isAuthenticated()">
                <a class="link" th:href="@{/login}" th:text="${o} ? #{header.overlay.login} : #{header.login}">로그인</a>
                <a class="link hide-overlay" th:href="@{/register}" th:text="#{header.register}">회원가입</a>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <a class="link hide-overlay" th:href="@{/orders}" th:text="#{header.orders}">주문내역</a>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button class="link-btn" type="submit" th:text="${o} ? #{header.overlay.logout} : #{header.logout}">로그아웃</button>
                </form>
            </th:block>
            <a class="cart-pill" th:href="@{/cart}">
                <span th:text="${o} ? (#{header.overlay.bag} + ' ' + ${cartCount}) : #{header.bag}">장바구니</span>
                <span th:if="${!o and cartCount > 0}" class="count" th:text="${cartCount}">0</span>
            </a>
        </div>
    </div>
    <div th:replace="~{fragments/nav :: drawer}"></div>
</header>

<!-- 푸터 -->
<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <strong th:text="${brand.name}">LUMO</strong>
        <p th:text="${brand.tagline}"></p>
        <p class="muted">
            <span th:text="${brand.company}"></span>
            <span th:if="${!#strings.isEmpty(brand.contactEmail)}"> · <span th:text="${brand.contactEmail}"></span></span>
        </p>
    </div>
    <script th:src="@{/js/shop.js}"></script>
</footer>

<!-- 알림 메시지 -->
<div th:fragment="flash" class="container">
    <div class="alert ok" th:if="${message}" th:text="${message}"></div>
    <div class="alert err" th:if="${error}" th:text="${error}"></div>
</div>

<!-- 상품 카드 -->
<a th:fragment="productCard(p)" class="product-card" th:href="@{/products/{id}(id=${p.id})}">
    <div class="thumb">
        <img th:if="${p.thumbnail != null}" th:src="@{${p.thumbnail}}" th:alt="${p.name}" loading="lazy">
        <span th:if="${p.thumbnail == null}" class="ph">상품 이미지</span>
        <span th:if="${p.status.name() == 'SOLD_OUT'}" class="badge soldout">품절</span>
    </div>
    <div class="name" th:text="${p.name}">상품명</div>
    <div class="price" th:text="|${#numbers.formatInteger(p.price, 0, 'COMMA')}원|">0원</div>
</a>

<!-- 페이지네이션: baseUrl 은 컨트롤러가 만든 쿼리 포함 경로 -->
<nav th:fragment="pagination(page, baseUrl)" class="pagination" th:if="${page.totalPages > 1}">
    <a th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
       th:href="${baseUrl + (#strings.contains(baseUrl, '?') ? '&' : '?') + 'page=' + i}"
       th:classappend="${i == page.number} ? 'active'" th:text="${i + 1}">1</a>
</nav>
</body>
</html>
