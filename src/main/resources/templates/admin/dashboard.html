<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('대시보드')}"></head>
<body>
<div class="shell">
<aside th:replace="~{fragments/admin :: sidebar(${active})}"></aside>
<main>
    <h1>대시보드</h1>
    <div class="kpis">
        <div class="kpi"><span>오늘 매출</span><strong class="blue" th:text="|${#numbers.formatInteger(stats.todaySales, 0, 'COMMA')}원|">0원</strong></div>
        <div class="kpi"><span>신규 주문</span><strong class="green" th:text="|${stats.newOrders}건|">0건</strong></div>
        <div class="kpi"><span>전체 상품</span><strong th:text="|${stats.productCount}개|">0개</strong></div>
        <div class="kpi"><span>품절 임박</span><strong class="red" th:text="|${stats.lowStock}개|">0개</strong></div>
    </div>
    <h2>최근 주문</h2>
    <div class="card">
        <table class="table">
            <thead><tr><th>주문번호</th><th>상품</th><th>금액</th><th>상태</th></tr></thead>
            <tbody>
            <tr th:each="o : ${stats.recent}">
                <td><a th:href="@{/admin/orders/{id}(id=${o.id})}" th:text="${o.orderNo}"></a></td>
                <td th:text="${o.summary}"></td>
                <td th:text="|${#numbers.formatInteger(o.total, 0, 'COMMA')}원|"></td>
                <td><span class="pill" th:classappend="${o.status.css}" th:text="${o.status.label}"></span></td>
            </tr>
            <tr th:if="${stats.recent.isEmpty()}"><td colspan="4" class="empty">주문이 없습니다.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</div>
</body>
</html>
